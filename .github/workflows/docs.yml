name: Deploy docs site

# Deploys docs-site/ to GitHub Pages on every push to main that
# touches the docs source. The workflow uses GitHub's native Pages
# deployment (not gh-pages branch) so there's no extra branch to
# clean up after.
#
# Setup (one time):
#   Settings → Pages → Source: GitHub Actions
#
# Manual run:
#   Actions tab → "Deploy docs site" → Run workflow

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping intermediate runs
# in a queue. We don't cancel in-progress runs because half-deployed
# Pages content is worse than slightly-stale content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build VitePress site
        run: npm run docs:build
        working-directory: docs-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
