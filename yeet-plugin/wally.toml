# Wally package manifest. `wally install` reads this and populates
# `./Packages/` with the resolved dependency tree. The `realm = "shared"`
# field is required even though this plugin doesn't publish its own package;
# Wally uses it to enforce dependency-compatibility rules (server packages
# can't be pulled into shared-realm projects, etc.).

[package]
name = "conception-world/yeet-plugin"
version = "0.1.2"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
Roact = "roblox/roact@1.4.4"
